  </svg>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <button id="back-btn" class="back" aria-label="Zur Übersicht" hidden><svg><use href="#i-back"/></svg></button>
        <h1 id="page-title"></h1>
      </div>
      <div class="topbar-status">
        <span id="net-status" class="net" hidden><svg><use href="#i-cloudoff"/></svg>Offline</span>
        <button id="drawer-btn" class="menu-btn" aria-label="Menü" hidden><svg><use href="#i-menu"/></svg></button>
        <button id="menu-btn" class="avatar" aria-label="Konto"></button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button id="add-btn" class="fab" aria-label="Hinzufügen" hidden><svg><use href="#i-plus"/></svg></button>

    <nav id="tabbar" class="tabbar" aria-label="Bereiche" hidden></nav>
  </div>

  <section id="gate" class="gate" hidden>
    <div class="gate-inner">
      <div class="gate-mark"><img src="icons/icon-192.png" alt="" width="72" height="72"></div>
      <h1 id="gate-title">Hafen</h1>
      <p id="gate-text"></p>
      <div id="gate-actions" class="gate-actions"></div>
    </div>
  </section>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="viewer" class="viewer"></dialog>
  <dialog id="drawer" class="drawer"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
