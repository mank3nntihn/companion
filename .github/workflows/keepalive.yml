name: Supabase Keepalive

# Hält das kostenlose Supabase-Projekt wach (Pause nach ca. 7 Tagen ohne Aktivität).
on:
  schedule:
    - cron: '17 6 */2 * *'   # alle zwei Tage, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anpingen
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY = '\K[^']+" js/config.js)
          RES=$(curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Antwort: $RES"
          echo "$RES" | grep -q '"ok' || { echo "Keepalive fehlgeschlagen"; exit 1; }
