name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Version setzen (Service Worker und App)
        run: |
          sed -i "s/tb-shell-v[0-9]*/tb-shell-${GITHUB_SHA::8}/" sw.js
          sed -i "s/BUILD = 'dev'/BUILD = '${GITHUB_SHA::7}, $(TZ=Europe/Berlin date '+%d.%m. %H:%M')'/" js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
